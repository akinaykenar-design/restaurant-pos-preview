<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><!-- an iPhone zooms the whole page when a small field takes focus; the app's own page locks it the same way -->
<title>Device preview</title>
<style>
  /* A phone on the desk: the preview inside a 390×844 frame, scaled to fit
     the window so the owner can see the phone look from a laptop. */
  html, body { margin:0; height:100%; background:#1c1c1e; font-family:-apple-system, "Segoe UI", sans-serif;
    touch-action:pan-x pan-y; overscroll-behavior:none; } /* a pinch on the black zoomed the whole page and lost the Device chip (9 Oct '26); the app's own pinch is inside the frame */
  body { display:flex; align-items:center; justify-content:center; gap:20px; }
  /* The STAGE is the frame's real size on the page — the scaled box, not the
     full-size one. Scaling alone left the big box in the layout, so on a phone
     the page grew wider than the screen, the browser zoomed out to fit, and the
     frame shrank again on the next measure. */
  /* CLIP, NOT HIDDEN: a hidden box still scrolls when code asks it to, and the
     app's own scrollIntoView reached up through the frame and slid the zoomed
     iPad out of reach for good (Oct '26). Clip has nothing to scroll; where it
     is not known, the script below puts any scroll straight back. */
  .stage { flex:none; overflow:hidden; overflow:clip; max-width:100vw; } /* never wider than the screen: Tablet on an upright phone widened the page for one layout and the fit locked onto it, cut off both sides with the tray below the edge (9 Oct '26) */
  .phone { --w:390px; --h:844px; --s:1; width:calc(var(--w) + 24px); height:calc(var(--h) + 24px);
    transform:translate(var(--tx, 0px), var(--ty, 0px)) scale(var(--s)); transform-origin:top left; background:#0a0a0a; border-radius:52px;
    padding:12px; box-sizing:border-box; box-shadow:0 30px 60px rgba(0,0,0,.6), inset 0 0 0 2px #333; flex:none; }
  iframe { width:var(--w); height:var(--h); border:0; border-radius:40px; background:#fff; display:block; }
  /* The hand: what the mouse is right now. One chip lit at a time. */
  .hand { display:flex; flex-direction:column; gap:8px; flex:none; }
  .hand button { width:120px; height:44px; border-radius:10px; border:1px solid #444; background:#2a2a2c; color:#ddd;
    font:700 14px/1 inherit; cursor:pointer; display:flex; align-items:center; gap:10px; padding:0 12px; }
  .hand button svg { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  .hand button.on { background:#e8f1ff; border-color:#2f7cf6; color:#1d5fd0; }
  .hand .hint { color:#888; font-size:12px; line-height:1.4; width:120px; margin-top:4px; }
  .hand .gap { height:12px; }
  .hand button.pill { background:#3d434a; border-color:#3d434a; color:#fff; }
  .hand button.pill.copy { background:#3a9d23; border-color:#3a9d23; }
  /* The tablet: an iPad on its side. Same frame, wider. */
  .phone.tablet { --w:1180px; --h:820px; border-radius:36px; }
  .phone.tablet iframe { border-radius:24px; }
  /* NARROW: THE CONTROLS GET OUT OF THE WAY (owner, Sep '26: "maximise space
     on phone"). They used to sit in a black band under the frame — two rows,
     112px of an 852px phone, and in landscape 60px of 393, which sliced the
     bottom off the docket. Now they are a TRAY: a grip you tap to open, and
     the app has the whole screen the rest of the time. The chips that had been
     dropped here come back with it — Finger, Pinch and Mouse are how a drag
     becomes a gesture, and the owner went looking for them (Sep '26: "I
     thought we had finger and pinch mode as well"). */
  :root { --safe: env(safe-area-inset-bottom, 0px); }
  body.stack { flex-direction:column; justify-content:flex-start; gap:0;
    padding:0 0 calc(30px + var(--safe)); box-sizing:border-box; }
  /* The grip lives on the STRIP — the tray's last line — and beside a
     laptop's device there is no tray, so no strip: '.grip' alone lost to
     '.hand button' and a blank key sat over Phone on a laptop. */
  .hand .strip { display:none; }
  /* A THUMB'S KEYS (Oct '26; the Sep '26 tray was seven 34-tall chips in two
     ragged rows). Two to a row, 44 tall, the words allowed a second line so
     "Copy for Claude" — and what it says back — never spill. The tray rises
     from the strip and is never wider than a phone held upright, so turned
     sideways it is a sheet in the middle, not two 400-wide slabs. */
  body.stack .hand { position:fixed; left:50%; right:auto; transform:translateX(-50%); bottom:var(--safe); z-index:5;
    flex-direction:row; flex-wrap:wrap; justify-content:center; align-items:center; gap:8px;
    width:min(100%, 480px); padding:8px 8px 0; box-sizing:border-box;
    background:rgba(16,16,18,.94); border-radius:14px 14px 0 0; }
  body.stack .hand button { flex:1 1 40%; width:auto; min-width:0; height:44px; padding:0 10px; justify-content:center;
    font-size:15px; gap:8px; white-space:normal; line-height:1.15; text-align:center; }
  body.stack .hand button[data-hand] { flex-basis:28%; }
  body.stack .hand button svg { width:20px; height:20px; }
  body.stack .hand .hint, body.stack .hand .gap { display:none; }
  /* THE CHIP NEVER MOVES. Shut, the strip is the whole tray; open, it is the
     tray's last line, on the same spot — so the thumb that opened it shuts it
     without looking (it used to jump to the top of the tray). The Device chip
     is the strip's middle and the two-finger key stands to its right, so the
     chip stays put when that key comes and goes with the Tablet view. */
  body.stack .hand .strip { order:9; flex:0 0 100%; display:grid; grid-template-columns:1fr auto 1fr;
    align-items:center; column-gap:8px; height:30px; }
  body.stack .hand .strip button { flex:none; width:auto; height:30px; padding:0 14px; border:0; border-radius:15px;
    background:rgba(16,16,18,.92); color:#ddd; font-size:12px; font-weight:600; letter-spacing:.3px; line-height:1;
    white-space:nowrap; gap:7px; box-shadow:0 2px 10px rgba(0,0,0,.45); }
  body.stack .hand .strip button svg { width:16px; height:16px; }
  /* SHUT, IT IS A CHIP, NOT A HAIR. A 72x18 line of grey at the foot of the
     screen is not a control anyone finds — and that is exactly what the owner
     went looking for. It reads "Device", 30 tall, on its own dark pill, in a
     strip of its own under the app — never over it: the app's bottom row
     ends in pager dots dead centre, and sideways the chip sat on Floor ·
     Table · Tools. AND IT CLEARS THE PHONE'S OWN HOME BAR (owner,
     Sep '26: "preview covers whole screen, I can't see the tablet phone
     buttons"): the strip sits above the safe area, where the OS lets a finger
     through. */
  body.stack .hand .strip .grip { grid-column:2; display:flex; align-items:center; cursor:pointer; }
  body.stack .hand .strip .grip::before { content:""; width:22px; height:3px; border-radius:2px; background:#8a8a8e; }
  body.stack .hand .strip .grip::after { content:"Device"; }
  body.stack:not(.tray-shut) .hand .strip .grip { background:#3a3a3c; box-shadow:none; }
  /* TWO FINGERS: WHO GETS THEM (owner, Oct '26: "I want to be able to pinch
     zoom the tablet and pinch zoom while on tablet so two modes of
     pinching"). One key, beside the chip, only in the Tablet view, saying
     which is on: Zoom iPad, or Pinch inside — lit in the picked look, because
     that is the one that changes what two fingers do to the till. A mouse
     has no second finger, so beside a mouse it is not drawn. */
  .hand .zkey { display:none; }
  body.stack.zoomable .hand .strip .zkey { grid-column:3; justify-self:start; display:flex; align-items:center; }
  body.stack .hand .strip .zkey.on { background:#e8f1ff; color:#1d5fd0; box-shadow:inset 0 0 0 1px #2f7cf6; }
  .zkey .z-in, .zkey.on .z-ipad { display:none; }
  .zkey.on .z-in { display:block; }
  @media (hover:hover), (pointer:fine) { body.stack.zoomable .hand .strip .zkey { display:none; } }
  body.stack.tray-shut .hand { background:none; padding:0; pointer-events:none; }
  body.stack.tray-shut .hand > :not(.strip) { display:none; }
  body.stack .hand .strip > * { pointer-events:auto; }
  /* A REAL FINGER NEEDS NO PRETEND ONE. Finger, Pinch and Mouse turn a MOUSE
     into a finger; on a phone or an iPad there is no mouse, so all three did
     nothing there. They stay beside a laptop. */
  @media (hover:none) and (pointer:coarse) { .hand .mo { display:none; } }
  /* A PHONE IS ALREADY A PHONE. Framing one inside another meant scaling the
     whole screen to fit — 0.84 on a 390 phone — and a whole screen scaled by a
     fraction is resampled, so every letter, edge and tile texture came out
     soft (owner, Sep '26: "there is blurring everywhere"). So on a narrow
     window the phone look drops its bezel and runs at 1:1. Only the TABLET
     look still scales, because 1180px cannot fit a phone any other way. */
  body.bare { padding-top:0; gap:0; }
  body.bare .stage { width:100%; flex:1 1 auto; min-height:0; }
  body.bare .phone { width:100%; height:100%; transform:none; padding:0; border-radius:0; box-shadow:none; background:none; }
  body.bare .phone iframe { width:100%; height:100%; border-radius:0; }
  /* ZOOMABLE: the Tablet view on a phone owns the whole screen above the
     strip, and the iPad inside it is moved and sized by the zoom. */
  body.zoomable .stage { position:relative; }
  body.zoomable .phone { box-shadow:inset 0 0 0 2px #333; } /* the drop shadow, cut off by the screen's edge, drew a line across the black */
</style>
<div class="stage"><div class="phone"><iframe src="index.html" allow="clipboard-write"></iframe></div></div>
<div class="hand">
  <div class="strip">
    <button class="grip" aria-label="Device"></button>
    <button class="zkey" aria-label="Two fingers"><svg class="z-ipad" viewBox="0 0 24 24"><path d="M4 4l6 6"/><path d="M4 4v5M4 4h5"/><path d="M20 20l-6-6"/><path d="M20 20v-5M20 20h-5"/></svg><svg class="z-in" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M9 12H6M6 12l2-2M6 12l2 2M15 12h3M18 12l-2-2M18 12l-2 2"/></svg><span>Zoom iPad</span></button>
  </div>
  <button data-device="phone" class="on" aria-label="Phone"><svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></svg>Phone</button>
  <button data-device="tablet" aria-label="Tablet"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M20 11v2"/></svg>Tablet</button>
  <div class="gap mo"></div>
  <button data-hand="finger" class="on mo" aria-label="Finger"><svg viewBox="0 0 24 24"><path d="M9 11V4a2 2 0 0 1 4 0v7"/><path d="M13 10a2 2 0 0 1 4 0v2"/><path d="M17 12a2 2 0 0 1 4 0v4a6 6 0 0 1-6 6h-2a6 6 0 0 1-5-2.6L4.5 14a2 2 0 0 1 3.2-2.4L9 13"/></svg>Finger</button>
  <button data-hand="pinch" class="mo" aria-label="Pinch"><svg viewBox="0 0 24 24"><path d="M4 4l6 6"/><path d="M4 4v5M4 4h5"/><path d="M20 20l-6-6"/><path d="M20 20v-5M20 20h-5"/></svg>Pinch</button>
  <button data-hand="mouse" class="mo" aria-label="Mouse"><svg viewBox="0 0 24 24"><path d="M5 3l14 9-7 1-4 6z"/></svg>Mouse</button>
  <div class="hint mo">Finger: drag swipes and pans, hold opens pads. Pinch: drag right zooms in, left zooms out. Mouse: the plain mouse.</div>
  <div class="gap"></div>
  <button class="pill" data-pv="latest">↻ Get latest</button>
  <button class="pill copy" data-pv="copy">⎘ Copy for Claude</button>
</div>
<script>
  // Fit the phone to the window, never larger than life.
  const size = () => document.querySelector('.phone').classList.contains('tablet') ? [1180, 820] : [390, 844];
  // THE FRAME FILLS A PHONE (owner, Sep '26: on his own phone the till came out
  // a toy in a black field — "this is how far I can scroll" — because the fit
  // always kept 200px clear for the hand column beside it). Narrow, the
  // controls drop UNDERNEATH, so the frame gets the whole width and the Tablet
  // button does what he wants it for: the tablet look, on a phone.
  // A big phone on its side is 915-932 wide, which read as a laptop: no tray,
  // no zoom. A touch screen whose short side is a phone's is a phone.
  const narrow = () => innerWidth <= 900 || (matchMedia('(pointer:coarse)').matches && Math.min(innerWidth, innerHeight) <= 500);
  // TURN THE PHONE AND YOU GET THE TABLET, IN AN IPAD'S OWN SHAPE (owner,
  // Sep '26: "make the tablet version landscape if I turn my phone", then
  // "just make it proportional"). Letting the rotated screen through at 1:1
  // gave the app a tablet LAYOUT but in a phone's shape — 852 by 375, twice
  // as wide as it is tall, nothing like the machine it is meant to be. So
  // rotation presses Tablet: the real 1180x820, scaled whole to fit, black
  // either side. It lands near half life size on a phone; the owner was told
  // and picked it.
  //
  // Rotation SETS the choice, it does not hold it: the two buttons still work
  // while the phone stays the way it is, and the next turn decides again.
  let turned = null;
  const setDevice = (name) => {
    document.querySelector('.phone').classList.toggle('tablet', name === 'tablet');
    document.querySelectorAll('.hand button[data-device]')
      .forEach(x => x.classList.toggle('on', x.dataset.device === name));
  };
  const orient = () => {
    if (!narrow()) { turned = null; return; }
    const land = innerWidth > innerHeight;
    if (land === turned) return;
    turned = land;
    setDevice(land ? 'tablet' : 'phone');
  };
  const fit = () => { const p = document.querySelector('.phone'); orient(); const [w, h] = size();
    document.body.classList.toggle('stack', narrow());
    // Bare: a phone showing the phone look. No frame, no scale, nothing soft.
    const bare = narrow() && !p.classList.contains('tablet') && innerWidth < 600; // an upright iPad is 'narrow' too, and a bare 820-wide app is not a phone
    document.body.classList.toggle('bare', bare);
    const zoomable = narrow() && p.classList.contains('tablet');   // the Tablet view on a phone; the Phone view is the phone's own screen
    document.body.classList.toggle('zoomable', zoomable);
    const st = p.parentElement;
    if (!zoomable) { Z.key = ''; pad.open = false; pad.home = null; }   // the next Tablet view starts from the whole picture, with no glide back to a spot from before
    if (bare) { for (const v of ['--s', '--tx', '--ty']) p.style.removeProperty(v); st.style.width = ''; st.style.height = ''; return; }
    if (zoomable) {
      // The iPad gets the whole screen above the strip, and the zoom places it.
      const vw = innerWidth, vh = innerHeight - (parseFloat(getComputedStyle(document.body).paddingBottom) || 0);
      const fitS = Math.min(1, vh / (h + 24), vw / (w + 24));
      const key = p.className + (innerWidth > innerHeight ? ' side' : ' up');
      // A turn or a new device starts from the whole picture; the browser's
      // bars coming and going keep the zoom.
      if (key !== Z.key) { pad.open = false; pad.home = null; }
      if (key !== Z.key || Z.s <= Z.fit + .001) Z.s = fitS;
      Object.assign(Z, { key, fit: fitS, vw, vh, W: w + 24, H: h + 24 });
      Z.s = Math.max(Z.fit, Math.min(1, Z.s));
      st.style.width = vw + 'px'; st.style.height = vh + 'px';
      place(); return;
    }
    p.style.removeProperty('--tx'); p.style.removeProperty('--ty');
    // Beside a laptop, 200 for the column; under a phone, the strip — the chip
    // has a line of its own and never sits on the app.
    const side = narrow() ? 0 : 200, below = narrow() ? (parseFloat(getComputedStyle(document.body).paddingBottom) || 30) : 24;
    const s = Math.min(1, (innerHeight - below) / (h + 24), (innerWidth - side) / (w + 24));
    p.style.setProperty('--s', s);
    st.style.width = ((w + 24) * s) + 'px';
    st.style.height = ((h + 24) * s) + 'px'; };
  // THE IPAD ZOOMS LIKE A PHOTO (Oct '26). On a phone the Tablet view is the
  // real 1180x820 drawn at a third of life size upright and under half
  // sideways: the bar's keys came out 19x14, Pay and Send 21x21, and only the
  // dish tiles were under a finger. Borrowed from the phone's own Photos:
  // two fingers zoom it from the whole picture up to LIFE SIZE and never past
  // it (life size is where every key is the iPad's own), and slide it round.
  // ONE FINGER IS ALWAYS THE TILL — taps, holds, scrolls and drags land on the
  // app exactly as on an iPad.
  const Z = { s: 1, fit: 1, tx: 0, ty: 0, vw: 0, vh: 0, W: 0, H: 0, key: '' };
  const place = () => {
    const p = document.querySelector('.phone');
    // Smaller than the screen: centred. Bigger: its edge never comes inside the screen's.
    const ax = (t, S, V) => S <= V ? (V - S) / 2 : Math.min(0, Math.max(V - S, t));
    Z.tx = ax(Z.tx, Z.W * Z.s, Z.vw); Z.ty = ax(Z.ty, Z.H * Z.s, Z.vh);
    p.style.setProperty('--s', Z.s); p.style.setProperty('--tx', Z.tx + 'px'); p.style.setProperty('--ty', Z.ty + 'px');
  };
  // TWO MODES OF PINCHING (owner, Oct '26: "I want to be able to pinch zoom
  // the tablet and pinch zoom while on tablet so two modes of pinching"). A
  // guess from where the fingers landed — the floor at life size went to the
  // app, anywhere else to the iPad — was a rule nobody could see. So the
  // person says it, on the key beside the Device chip:
  //   Zoom iPad    — two fingers zoom and slide the iPad picture, anywhere on it;
  //   Pinch inside — two fingers are the app's, as on a real iPad (the floor's
  //                  own zoom), and the picture stays at whatever zoom it was left.
  // Remembered on this phone.
  const TWO = 'pv-two-fingers';
  let two = 'ipad';
  try { if (localStorage.getItem(TWO) === 'inside') two = 'inside'; } catch (e) {}
  const zkey = document.querySelector('.zkey');
  const showTwo = () => { zkey.classList.toggle('on', two === 'inside'); zkey.setAttribute('aria-pressed', String(two === 'inside'));
    zkey.querySelector('span').textContent = two === 'inside' ? 'Pinch inside' : 'Zoom iPad'; };
  zkey.addEventListener('click', () => { two = two === 'inside' ? 'ipad' : 'inside'; try { localStorage.setItem(TWO, two); } catch (e) {} showTwo(); });
  showTwo();
  const zooming = () => document.body.classList.contains('zoomable') && two === 'ipad';
  // The gesture: every finger's spot ON THIS PAGE, wherever it landed — on the
  // app (read through the frame's box as it is now) or on the black round it.
  const G = { pts: new Map(), on: null, quietUntil: 0, raf: 0 };
  const mid = () => { const v = [...G.pts.values()]; if (v.length < 2) return { x: v[0].x, y: v[0].y, d: 0 };
    return { x: (v[0].x + v[1].x) / 2, y: (v[0].y + v[1].y) / 2, d: Math.hypot(v[0].x - v[1].x, v[0].y - v[1].y) }; };
  const anchor = () => { if (!G.pts.size) return; const m = mid(), r = document.querySelector('.stage').getBoundingClientRect();
    Object.assign(G.on, { m0: m, s0: Z.s, cx: (m.x - r.left - Z.tx) / Z.s, cy: (m.y - r.top - Z.ty) / Z.s, sl: r.left, st: r.top }); };
  const paint = () => { G.raf = 0; const g = G.on; if (!g || !G.pts.size) return; const m = mid(); g.last = m;
    if (m.d && g.m0.d) Z.s = Math.max(Z.fit, Math.min(1, g.s0 * m.d / g.m0.d));
    Z.tx = m.x - g.sl - g.cx * Z.s; Z.ty = m.y - g.st - g.cy * Z.s; place(); };
  const grab = () => { G.on = {}; anchor(); pad.home = null;   // moved by hand: no glide back
    document.querySelector('.phone').style.willChange = 'transform'; };
  const moved = () => { if (G.on && !G.raf) G.raf = requestAnimationFrame(paint); };
  const lifted = () => {
    if (!G.on) return;
    if (G.pts.size) { anchor(); return; }   // one finger still down carries on sliding it
    // Near either end, land on it: the whole picture, or exactly life size —
    // and life size grows about the fingers, so what was under them stays.
    const g = G.on, m = g.last;
    if (Z.s < Z.fit * 1.1) Z.s = Z.fit;
    else if (Z.s > .95 && Z.s < 1) {
      if (m) { const cx = (m.x - g.sl - Z.tx) / Z.s, cy = (m.y - g.st - Z.ty) / Z.s; Z.tx = m.x - g.sl - cx; Z.ty = m.y - g.st - cy; }
      Z.s = 1;
    }
    place(); G.on = null; G.quietUntil = Date.now() + 400; G.endedAt = performance.now();
    document.querySelector('.phone').style.willChange = '';   // drawn sharp again at the size it stopped at
  };
  // Two fingers on the black round the iPad, or on its edge, zoom it too.
  const outer = (e) => { G.pts.forEach((v, k) => { if (k[0] === 'o') G.pts.delete(k); });
    for (const t of e.touches) if (!(t.target.closest && t.target.closest('.hand'))) G.pts.set('o' + t.identifier, { x: t.clientX, y: t.clientY }); };
  document.addEventListener('touchstart', (e) => { outer(e); if (G.on) { anchor(); return; } if (G.pts.size >= 2 && zooming()) grab(); }, { passive: true });
  document.addEventListener('touchmove', (e) => { outer(e); moved(); }, { passive: true });
  for (const type of ['touchend', 'touchcancel']) document.addEventListener(type, (e) => { outer(e); lifted(); if (!G.pts.size) requestAnimationFrame(() => pad.follow()); }, { passive: true });
  // Inside the app: who gets two fingers is settled when the second one lands,
  // before the app hears of it. In Zoom iPad the app never sees the second
  // finger, and the first is called off, so no press, hold or tap is left
  // waiting for a lift it will never get.
  const pinch = (doc) => {
    const win = doc.defaultView;
    let first = null;
    const stop = (e) => e.stopImmediatePropagation();
    const sync = (e) => { const r = frame.getBoundingClientRect(), k = r.width / (frame.offsetWidth || 1);
      G.pts.forEach((v, key) => { if (key[0] === 'f') G.pts.delete(key); });
      for (const t of e.touches) G.pts.set('f' + t.identifier, { x: r.left + t.clientX * k, y: r.top + t.clientY * k }); };
    // A scroller the first finger was in keeps still while the iPad moves
    // (the floor's own pinch does the same): the browser would scroll it under
    // the two fingers' middle as they slide.
    const held = [];
    const hold = (el) => { for (let n = el; n && n.nodeType === 1 && n !== doc.documentElement; n = n.parentElement) {
      const cs = win.getComputedStyle(n);
      if (/(auto|scroll)/.test(cs.overflowX + ' ' + cs.overflowY) && (n.scrollHeight > n.clientHeight + 1 || n.scrollWidth > n.clientWidth + 1)) { held.push([n, n.style.overflow]); n.style.overflow = 'hidden'; } } };
    const letGo = () => { for (const [n, v] of held.splice(0)) n.style.overflow = v; };
    const callOff = (e) => {
      if (!first) return;
      const t = [...e.touches].find(t => t.target === first.target) || e.touches[0];
      // A table being carried in the floor editor: hand the app the second
      // finger a real iPad would, so its own rule sends the table back where
      // it began and saves nothing. A bare cancel reads as a finished drag.
      if (win.floorDragLive && win.floorDragLive() && e.touches.length >= 2) { try {
        const tt = [...e.touches].slice(0, 2).map(x => new win.Touch({ identifier: x.identifier, target: first.target, clientX: x.clientX, clientY: x.clientY, pageX: x.pageX, pageY: x.pageY, screenX: x.screenX, screenY: x.screenY }));
