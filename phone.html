<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Device preview</title>
<style>
  /* A phone on the desk: the preview inside a 390×844 frame, scaled to fit
     the window so the owner can see the phone look from a laptop. */
  html, body { margin:0; height:100%; background:#1c1c1e; font-family:-apple-system, "Segoe UI", sans-serif; }
  body { display:flex; align-items:center; justify-content:center; gap:20px; }
  /* The STAGE is the frame's real size on the page — the scaled box, not the
     full-size one. Scaling alone left the big box in the layout, so on a phone
     the page grew wider than the screen, the browser zoomed out to fit, and the
     frame shrank again on the next measure. */
  .stage { flex:none; overflow:hidden; }
  .phone { --w:390px; --h:844px; --s:1; width:calc(var(--w) + 24px); height:calc(var(--h) + 24px);
    transform:scale(var(--s)); transform-origin:top left; background:#0a0a0a; border-radius:52px;
    padding:12px; box-sizing:border-box; box-shadow:0 30px 60px rgba(0,0,0,.6), inset 0 0 0 2px #333; flex:none; }
  iframe { width:var(--w); height:var(--h); border:0; border-radius:40px; background:#fff; display:block; }
  /* The hand: what the mouse is right now. One chip lit at a time. */
  .hand { display:flex; flex-direction:column; gap:8px; flex:none; }
  .hand button { width:120px; height:44px; border-radius:10px; border:1px solid #444; background:#2a2a2c; color:#ddd;
    font:700 14px/1 inherit; cursor:pointer; display:flex; align-items:center; gap:10px; padding:0 12px; }
  .hand button svg { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  .hand button.on { background:#e8f1ff; border-color:#2f7cf6; color:#1d5fd0; }
  .hand .hint { color:#888; font-size:12px; line-height:1.4; width:120px; margin-top:4px; }
  .hand .gap { height:12px; }
  .hand button.pill { background:#3d434a; border-color:#3d434a; color:#fff; }
  .hand button.pill.copy { background:#3a9d23; border-color:#3a9d23; }
  /* The tablet: an iPad on its side. Same frame, wider. */
  .phone.tablet { --w:1180px; --h:820px; border-radius:36px; }
  .phone.tablet iframe { border-radius:24px; }
  /* NARROW: THE CONTROLS GET OUT OF THE WAY (owner, Sep '26: "maximise space
     on phone"). They used to sit in a black band under the frame — two rows,
     112px of an 852px phone, and in landscape 60px of 393, which sliced the
     bottom off the docket. Now they are a TRAY: a grip you tap to open, and
     the app has the whole screen the rest of the time. The chips that had been
     dropped here come back with it — Finger, Pinch and Mouse are how a drag
     becomes a gesture, and the owner went looking for them (Sep '26: "I
     thought we had finger and pinch mode as well"). */
  /* The grip gets a clear strip under the app rather than sitting on top of
     it: the app's own bottom row ends in pager dots dead centre, and an
     overlay there would eat them.
     AND IT CLEARS THE PHONE'S OWN HOME BAR (owner, Sep '26: "preview covers
     whole screen, I can't see the tablet phone buttons"). It was pinned to
     bottom:0 and drawn as a 4px hairline — which on an iPhone lands inside
     the home indicator, so it was both invisible and un-tappable: the OS
     takes that strip. It now sits above the safe area, and it is a chip you
     can see rather than a hair. */
  :root { --safe: env(safe-area-inset-bottom, 0px); }
  body.stack { flex-direction:column; justify-content:flex-start; gap:0;
    padding:0 0 calc(30px + var(--safe)); box-sizing:border-box; }
  body.stack .hand { position:fixed; left:0; right:0; bottom:var(--safe); z-index:5; flex-direction:row; flex-wrap:wrap;
    justify-content:center; align-items:center; gap:6px; width:100%; padding:0 6px 6px; box-sizing:border-box;
    background:rgba(16,16,18,.94); border-radius:14px 14px 0 0; }
  body.stack .hand button { width:auto; min-width:0; height:34px; padding:0 10px; justify-content:center; font-size:13px; gap:6px; }
  body.stack .hand button svg { width:16px; height:16px; }
  body.stack .hand .hint, body.stack .hand .gap { display:none; }
  /* The grip IS the door: tap to open, tap to shut. Nothing else opens it. */
  .grip { display:none; }
  /* The grip is the WHOLE first line of the tray when it is open, so the chips
     start underneath it — but only a thumb's worth of it is a target when the
     tray is shut, or it would swallow taps meant for the app's own bottom row
     underneath. */
  body.stack .hand button.grip { display:block; width:100%; flex:0 0 100%; height:22px; border:0; background:none; padding:0; cursor:pointer; }
  body.stack .hand button.grip::before { content:""; display:block; width:56px; height:4px; margin:9px auto; border-radius:2px; background:#8a8a8e; }
  body.stack.tray-shut .hand { left:50%; right:auto; transform:translateX(-50%); }
  /* SHUT, IT IS A CHIP, NOT A HAIR. A 72x18 line of grey at the foot of the
     screen is not a control anyone finds — and that is exactly what the owner
     went looking for. Shut it reads "Device", 30 tall, on its own dark pill,
     so the way back to Phone / Tablet / Finger / Pinch / Mouse is visible
     without covering the app's own bottom row. */
  body.stack.tray-shut .hand { width:auto; background:none; padding:0 0 4px; }
  body.stack.tray-shut .hand button.grip { width:auto; flex:0 0 auto; height:30px; padding:0 14px;
    border-radius:15px; background:rgba(16,16,18,.92); color:#ddd; font-size:12px; font-weight:600;
    letter-spacing:.3px; box-shadow:0 2px 10px rgba(0,0,0,.45); }
  body.stack.tray-shut .hand button.grip::before { display:inline-block; width:22px; height:3px;
    margin:0 7px 3px 0; vertical-align:middle; }
  body.stack.tray-shut .hand button.grip::after { content:"Device"; }
  body.stack.tray-shut .hand button:not(.grip) { display:none; }
  /* A PHONE IS ALREADY A PHONE. Framing one inside another meant scaling the
     whole screen to fit — 0.84 on a 390 phone — and a whole screen scaled by a
     fraction is resampled, so every letter, edge and tile texture came out
     soft (owner, Sep '26: "there is blurring everywhere"). So on a narrow
     window the phone look drops its bezel and runs at 1:1. Only the TABLET
     look still scales, because 1180px cannot fit a phone any other way. */
  body.bare { padding-top:0; gap:0; }
  body.bare .stage { width:100%; flex:1 1 auto; min-height:0; }
  body.bare .phone { width:100%; height:100%; transform:none; padding:0; border-radius:0; box-shadow:none; background:none; }
  body.bare .phone iframe { width:100%; height:100%; border-radius:0; }
</style>
<div class="stage"><div class="phone"><iframe src="index.html" allow="clipboard-write"></iframe></div></div>
<div class="hand">
  <button class="grip" aria-label="Controls"></button>
  <button data-device="phone" class="on" aria-label="Phone"><svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></svg>Phone</button>
  <button data-device="tablet" aria-label="Tablet"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M20 11v2"/></svg>Tablet</button>
  <div class="gap"></div>
  <button data-hand="finger" class="on" aria-label="Finger"><svg viewBox="0 0 24 24"><path d="M9 11V4a2 2 0 0 1 4 0v7"/><path d="M13 10a2 2 0 0 1 4 0v2"/><path d="M17 12a2 2 0 0 1 4 0v4a6 6 0 0 1-6 6h-2a6 6 0 0 1-5-2.6L4.5 14a2 2 0 0 1 3.2-2.4L9 13"/></svg>Finger</button>
  <button data-hand="pinch" aria-label="Pinch"><svg viewBox="0 0 24 24"><path d="M4 4l6 6"/><path d="M4 4v5M4 4h5"/><path d="M20 20l-6-6"/><path d="M20 20v-5M20 20h-5"/></svg>Pinch</button>
  <button data-hand="mouse" aria-label="Mouse"><svg viewBox="0 0 24 24"><path d="M5 3l14 9-7 1-4 6z"/></svg>Mouse</button>
  <div class="hint">Finger: drag swipes and pans, hold opens pads. Pinch: drag right zooms in, left zooms out. Mouse: the plain mouse.</div>
  <div class="gap"></div>
  <button class="pill" data-pv="latest">↻ Get latest</button>
  <button class="pill copy" data-pv="copy">⎘ Copy for Claude</button>
</div>
<script>
  // Fit the phone to the window, never larger than life.
  const size = () => document.querySelector('.phone').classList.contains('tablet') ? [1180, 820] : [390, 844];
  // THE FRAME FILLS A PHONE (owner, Sep '26: on his own phone the till came out
  // a toy in a black field — "this is how far I can scroll" — because the fit
  // always kept 200px clear for the hand column beside it). Narrow, the
  // controls drop UNDERNEATH, so the frame gets the whole width and the Tablet
  // button does what he wants it for: the tablet look, on a phone.
  const narrow = () => innerWidth <= 900;
  // TURN THE PHONE AND YOU GET THE TABLET, IN AN IPAD'S OWN SHAPE (owner,
  // Sep '26: "make the tablet version landscape if I turn my phone", then
  // "just make it proportional"). Letting the rotated screen through at 1:1
  // gave the app a tablet LAYOUT but in a phone's shape — 852 by 375, twice
  // as wide as it is tall, nothing like the machine it is meant to be. So
  // rotation presses Tablet: the real 1180x820, scaled whole to fit, black
  // either side. It lands near half life size on a phone; the owner was told
  // and picked it.
  //
  // Rotation SETS the choice, it does not hold it: the two buttons still work
  // while the phone stays the way it is, and the next turn decides again.
  let turned = null;
  const setDevice = (name) => {
    document.querySelector('.phone').classList.toggle('tablet', name === 'tablet');
    document.querySelectorAll('.hand button[data-device]')
      .forEach(x => x.classList.toggle('on', x.dataset.device === name));
  };
  const orient = () => {
    if (!narrow()) { turned = null; return; }
    const land = innerWidth > innerHeight;
    if (land === turned) return;
    turned = land;
    setDevice(land ? 'tablet' : 'phone');
  };
  const fit = () => { const p = document.querySelector('.phone'); orient(); const [w, h] = size();
    document.body.classList.toggle('stack', narrow());
    const side = narrow() ? 0 : 200, below = narrow() ? 18 : 24;
    // Bare: a phone showing the phone look. No frame, no scale, nothing soft.
    const bare = narrow() && !p.classList.contains('tablet');
    document.body.classList.toggle('bare', bare);
    const st = p.parentElement;
    if (bare) { p.style.removeProperty('--s'); st.style.width = ''; st.style.height = ''; return; }
    const s = Math.min(1, (innerHeight - below) / (h + 24), (innerWidth - side) / (w + 24));
    p.style.setProperty('--s', s);
    st.style.width = ((w + 24) * s) + 'px';
    st.style.height = ((h + 24) * s) + 'px'; };
  // A mobile browser re-lays-out after the box changes size, which changes
  // innerWidth, which changes the fit — so settle it rather than measure once.
  addEventListener('resize', fit);
  const settle = () => { fit(); requestAnimationFrame(() => { fit(); setTimeout(fit, 60); }); };
  // The tray starts shut: the app gets the screen, the grip says where the
  // controls went. The grip is the only way in and the only way out.
  document.body.classList.add('tray-shut');
  document.querySelector('.grip').addEventListener('click', () => {
    document.body.classList.toggle('tray-shut'); });
  settle();

  // THE MOUSE IS A HAND (owner, Sep '26). The app's swipes, holds and
  // presses listen for touch, and its pointer handlers read pointerType; a
  // laptop mouse sends neither. So inside the frame a mouse-down becomes a
  // finger landing (a touch-flavoured pointerdown, then touchstart), a move
  // is the finger sliding, a release is the finger lifting — in the order a
  // real finger fires them — and the mouse's own events are kept out so
  // nothing runs twice. A drag is never a tap: the click the browser fires
  // after a drag is swallowed. Typing in a field stays a keyboard job.
  //
  // A real finger PANS because the browser scrolls under it; it never does
  // that for a pretend one. So when the app lets a move through, the shim
  // scrolls the nearest scroller by the same distance, locked to the axis
  // the drag started on, the way the phone does.
  //
  // PINCH: one mouse stands in for two fingers either side of where it
  // landed — dragging right parts them (zoom in), left brings them together.
  let hand = 'finger';
  const finger = (doc) => {
    const win = doc.defaultView;
    let down = null; // { target, x0, y0, moved, axis, lx, ly, scroller }
    const scrollerOf = (el) => { for (let n = el; n && n !== doc.body; n = n.parentElement) { const cs = win.getComputedStyle(n); const x = /(auto|scroll)/.test(cs.overflowX) && n.scrollWidth > n.clientWidth + 1, y = /(auto|scroll)/.test(cs.overflowY) && n.scrollHeight > n.clientHeight + 1; if (x || y) return { el: n, x, y }; } return null; };
    const touch = (id, x, y) => new win.Touch({ identifier: id, target: down.target, clientX: x, clientY: y, pageX: x + win.scrollX, pageY: y + win.scrollY, screenX: x, screenY: y, radiusX: 8, radiusY: 8, force: 1 });
    const ptr = (type, x, y) => down.target.dispatchEvent(new win.PointerEvent(type, { bubbles: true, cancelable: true, composed: true, view: win, clientX: x, clientY: y, screenX: x, screenY: y, pointerId: 1, pointerType: 'touch', isPrimary: true, button: type === 'pointermove' ? -1 : 0, buttons: type === 'pointerup' ? 0 : 1, width: 16, height: 16, pressure: type === 'pointerup' ? 0 : 0.5 }));
    const fire = (type, x, y) => {
      const fingers = hand === 'pinch' ? (() => { const d = Math.max(10, 80 * (1 + (x - down.x0) / 240)); return [touch(1, down.x0 - d, down.y0), touch(2, down.x0 + d, down.y0)]; })() : [touch(1, x, y)]; // 240px of drag doubles the spread: a whole-hand pinch, not a twitch
      ptr({ touchstart: 'pointerdown', touchmove: 'pointermove', touchend: 'pointerup' }[type], x, y);
      const ev = new win.TouchEvent(type, { bubbles: true, cancelable: true, composed: true, view: win,
        touches: type === 'touchend' ? [] : fingers, targetTouches: type === 'touchend' ? [] : fingers, changedTouches: fingers });
      down.target.dispatchEvent(ev);
      return ev;
    };
    const stop = (e) => { e.stopImmediatePropagation(); };
    const mine = (e) => hand !== 'mouse' && e.pointerType === 'mouse' && e.isTrusted;
    doc.addEventListener('pointerdown', (e) => {
      if (!mine(e) || e.button !== 0 || !e.target || e.target.closest('input, textarea, select')) return;
      down = { target: e.target, x0: e.clientX, y0: e.clientY, lx: e.clientX, ly: e.clientY, moved: false, axis: null, scroller: scrollerOf(e.target) };
      fire('touchstart', e.clientX, e.clientY);
      stop(e);
    }, true);
    doc.addEventListener('pointermove', (e) => {
      if (!mine(e) || !down) return;
      const dx = e.clientX - down.x0, dy = e.clientY - down.y0;
      if (!down.moved && Math.hypot(dx, dy) > 8) { down.moved = true; down.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y'; }
      const ev = fire('touchmove', e.clientX, e.clientY);
      // The browser's pan, by hand: only when the app let the move through.
      if (hand === 'finger' && down.moved && !ev.defaultPrevented && down.scroller) {
        const s = down.scroller;
        if (down.axis === 'x' && s.x) s.el.scrollLeft -= e.clientX - down.lx;
        if (down.axis === 'y' && s.y) s.el.scrollTop -= e.clientY - down.ly;
      }
      down.lx = e.clientX; down.ly = e.clientY;
      stop(e);
    }, true);
    const lift = (e) => {
      if (!mine(e) || !down) return;
      fire('touchend', e.clientX, e.clientY);
      const dragged = down.moved;
      down = null;
      stop(e);
      // The browser only fires that click when the drag ended where it began;
      // when it doesn't, the swallow must not lie in wait for the next tap.
      if (dragged) { const eat = (c) => { c.preventDefault(); c.stopImmediatePropagation(); off(); }; const off = () => { doc.removeEventListener('click', eat, true); doc.removeEventListener('pointerdown', off, true); }; doc.addEventListener('click', eat, true); doc.addEventListener('pointerdown', off, true); setTimeout(off, 400); }
    };
    doc.addEventListener('pointerup', lift, true);
    doc.addEventListener('pointercancel', lift, true);
    doc.addEventListener('pointerleave', (e) => { if (down && e.target === doc.documentElement) lift(e); }, true);
    // The mouse's own events stay out while a finger is down.
    for (const type of ['mousedown', 'mousemove', 'mouseup']) doc.addEventListener(type, (e) => { if (hand !== 'mouse' && e.isTrusted && (down || type !== 'mousemove') && !(e.target && e.target.closest && e.target.closest('input, textarea, select'))) stop(e); }, true);
    doc.__finger = true; // on the DOCUMENT: the frame's first blank page hands its window to the real one
  };
  const frame = document.querySelector('iframe');
  const arm = () => { try { const d = frame.contentDocument; if (d && d.body && d.location.href !== 'about:blank' && !d.__finger) finger(d); } catch (e) {} };
  frame.addEventListener('load', arm); arm();
  document.querySelectorAll('.hand button[data-hand]').forEach(b => b.addEventListener('click', () => { hand = b.dataset.hand; document.querySelectorAll('.hand button[data-hand]').forEach(x => x.classList.toggle('on', x === b)); }));
  // Phone or tablet: the frame changes size and the app inside lays itself out again.
  document.querySelectorAll('.hand button[data-device]').forEach(b => b.addEventListener('click', () => { setDevice(b.dataset.device); settle(); }));
  // The preview's two pills live out here, beside the device.
  document.querySelectorAll('.hand button[data-pv]').forEach(b => b.addEventListener('click', () => { const w = frame.contentWindow; const fn = b.dataset.pv === 'copy' ? w.__pvCopy : w.__pvLatest; if (fn) fn(); }));
</script>
