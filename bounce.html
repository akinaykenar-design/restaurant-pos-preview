<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bounce</title><style>
html,body{margin:0;height:100%;background:#e8e6e1;font:700 18px -apple-system,Segoe UI,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.list{position:absolute;inset:0;overflow:hidden}
.inner{will-change:transform}
.tile{height:120px;margin:12px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.hint{position:fixed;left:0;right:0;bottom:12px;text-align:center;font:600 13px -apple-system,Segoe UI,sans-serif;color:#666;pointer-events:none}
</style>
<div class="list"><div class="inner" id="inner"></div></div>
<div class="hint">Drag with a finger or the mouse. Pull past either end and let go.</div>
<script>
// The rubber band: the list scrolls with the finger; past either end it
// follows at a third of the speed, and springs back when the finger lifts.
const inner = document.getElementById('inner');
for (let i = 1; i <= 14; i++) { const t = document.createElement('div'); t.className = 'tile'; t.textContent = 'Tile ' + i; inner.appendChild(t); }
let y = 0, down = null, vy = 0, lastT = 0, raf = 0;
const max = () => Math.max(0, inner.scrollHeight - innerHeight);
const band = (v) => v < 0 ? v / 3 : v > max() ? max() + (v - max()) / 3 : v;
const paint = (pos, anim) => { inner.style.transition = anim ? 'transform .32s cubic-bezier(.2,.8,.3,1)' : 'none'; inner.style.transform = `translateY(${-pos}px)`; };
const settle = () => { y = Math.min(max(), Math.max(0, y)); paint(y, true); };
const glide = () => { if (Math.abs(vy) < 0.05 || y < 0 || y > max()) { settle(); return; } y += vy * 16; vy *= 0.95; paint(y, false); raf = requestAnimationFrame(glide); };
addEventListener('pointerdown', (e) => { cancelAnimationFrame(raf); down = { y0: e.clientY, start: y }; vy = 0; lastT = performance.now(); });
addEventListener('pointermove', (e) => { if (!down) return; const raw = down.start - (e.clientY - down.y0); const now = performance.now(); vy = (band(raw) - y) / Math.max(1, now - lastT); lastT = now; y = band(raw); paint(y, false); });
const lift = () => { if (!down) return; down = null; if (y < 0 || y > max()) settle(); else glide(); };
addEventListener('pointerup', lift); addEventListener('pointercancel', lift);
addEventListener('wheel', (e) => { cancelAnimationFrame(raf); y = band(y + e.deltaY); paint(y, false); clearTimeout(window.__w); window.__w = setTimeout(settle, 80); }, { passive: true });
</script>
